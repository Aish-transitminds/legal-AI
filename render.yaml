services:
  - type: web
    name: legal-document-ai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_TIMEOUT_SECONDS
        value: "45"
      - key: CORS_ORIGINS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-v4-flash-0731:free
      - key: DATABASE_URL
        sync: false

  - type: static
    name: legal-document-ai-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

# Render's managed PostgreSQL plan and persistent storage are account/plan dependent.
# Add a database only after Phase 2 schema work and cost confirmation.
